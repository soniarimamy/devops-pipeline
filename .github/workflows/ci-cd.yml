name: CI/CD Pipeline (Docker → Remote)

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Docker Hub credentials
        id: check-docker-creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "docker_creds_available=true" >> $GITHUB_OUTPUT
          else
            echo "docker_creds_available=false" >> $GITHUB_OUTPUT
            echo "Warning: Docker Hub credentials not available"
          fi
      - name: Set up Docker Buildx
        if: steps.check-docker-creds.outputs.docker_creds_available == 'true'
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        if: steps.check-docker-creds.outputs.docker_creds_available == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        if: steps.check-docker-creds.outputs.docker_creds_available == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-pipeline:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-pipeline:latest
      - name: Skip build and push
        if: steps.check-docker-creds.outputs.docker_creds_available == 'false'
        run: echo "Skipping build and push due to missing Docker Hub credentials"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for deployment credentials
        id: check-deploy-creds
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ] && [ -n "${{ secrets.DEPLOY_USER }}" ] && [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "deploy_creds_available=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_creds_available=false" >> $GITHUB_OUTPUT
            echo "Warning: Deployment credentials not available"
          fi
      - name: Setup SSH agent
        if: steps.check-deploy-creds.outputs.deploy_creds_available == 'true'
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Deploy on remote host
        if: steps.check-deploy-creds.outputs.deploy_creds_available == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            export IMAGE_TAG="${{ github.sha }}"
            export DOCKERHUB_USER="${{ secrets.DOCKERHUB_USERNAME }}"
            export DEPLOY_MODE="${{ secrets.DEPLOY_MODE || 'compose' }}"

            # Pull the new image
            docker pull docker.io/${DOCKERHUB_USER}/devops-pipeline:${IMAGE_TAG}

            # Deploy based on mode
            if [ "$DEPLOY_MODE" = "swarm" ]; then
              echo "Deploying with Docker Swarm"
              envsubst < docker-stack.yml > /tmp/docker-stack.yml
              docker stack deploy -c /tmp/docker-stack.yml devops_pipeline
            else
              echo "Deploying with Docker Compose"
              envsubst < docker-compose.prod.yml > /tmp/docker-compose.yml
              docker-compose -f /tmp/docker-compose.yml up -d
            fi

            # Clean up old images
            docker image prune -f
      - name: Skip deployment
        if: steps.check-deploy-creds.outputs.deploy_creds_available == 'false'
        run: echo "Skipping deployment due to missing credentials"
